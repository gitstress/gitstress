name: GitStress Concurrency CI Gate

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  concurrency-gate:
    name: Concurrency Saturation & Bottleneck Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run GitStress MVA Concurrency Diagnostic
        id: gitstress
        run: |
          node oss/dist/gitstress.js . --ci --json > gitstress-report.json || echo "SCAN_FAILED=true" >> $GITHUB_ENV
          cat gitstress-report.json

      - name: Parse Diagnostic & Post PR Forensic Review
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let report = null;
            try {
              report = JSON.parse(fs.readFileSync('gitstress-report.json', 'utf8'));
            } catch (e) {
              console.log('No report generated or parse failed:', e.message);
            }

            if (!report) return;

            const c = report.culprit || {};
            const failsAt = c.failsAt || 'Unknown';
            const failsAtNum = c.failsAtNum || 0;
            const symbol = c.symbol || 'None';
            const file = c.file || 'N/A';
            const line = c.line || 'N/A';
            const why = c.why || 'No bottleneck identified';
            const isRegressed = failsAtNum > 0 && failsAtNum < 25;
            const statusLabel = isRegressed ? 'FAILED' : 'PASSED';

            const commentBody = [
              `### GitStress Concurrency Diagnostic // ${statusLabel}`,
              '',
              '| Metric | Result |',
              '| :--- | :--- |',
              `| **Saturation Knee** | **${failsAt}** |`,
              `| **Identified Culprit** | \`${symbol}\` |`,
              `| **File Location** | \`${file}:${line}\` |`,
              `| **Root Bottleneck** | ${why} |`,
              `| **Headroom Patch** | ${c.improvedHeadroom || 'N/A'} |`,
              '',
              '```sql',
              c.fix || '-- No patch required',
              '```',
              '',
              '> **CI Concurrency Gate**: Minimum headroom requirement is 25 concurrent clients.',
              '*Generated by GitStress v0.12.0 (Operational Queuing Network MVA Engine)*'
            ].join('\n');

            if (context.issue && context.issue.number) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
            }

            if (process.env.SCAN_FAILED === 'true' || isRegressed) {
              core.setFailed(`GitStress CI Gate Failure: Predicted concurrency saturation (${failsAt}) breached minimum threshold.`);
            }
